apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-user-rolebinding-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
subjects:
- kind: ServiceAccount
  name: ci-user-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
