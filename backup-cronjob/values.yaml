activeDeadlineSeconds: 7200
backoffLimit: 3
# Environment variables that are passed on to the container at runtime.
envVars:
failedJobsHistoryLimit: 1
backupImage:
  repository: zeilenwerk/openshift-backup
  tag: latest
# * * * * *
# │ │ │ │ │
# │ │ │ │ └───── Day of the week (0 - 7) (Sunday = 0 or 7)
# │ │ │ └──────── Month (1 - 12)
# │ │ └──────────── Day of the month (1 - 31)
# │ └──────────────── Hour (0 - 23)
# └──────────────────── Minute (0 - 59)
# At 00:00 every day
schedule: 0 0 * * *
successfulJobsHistoryLimit: 0
